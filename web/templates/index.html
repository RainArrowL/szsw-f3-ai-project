<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>税金智</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="bg-particles" id="particles"></div>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                    <path d="M14 15h3M14 18h2"/>
                </svg>
                <h1>税金智</h1>
            </div>
            <span class="header-sub">上市公司财务数据 · 多源一键获取</span>
        </header>

        <!-- 标签栏 -->
        <div class="tab-bar">
            <button class="tab-btn active" data-module="annual">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
                年报数据
            </button>
            <button class="tab-btn" data-module="institutions">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                机构法人名录
            </button>
            <button class="tab-btn" data-module="szse">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                深交所日度概况
            </button>
            <button class="tab-btn" data-module="dividend">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                </svg>
                分红公告查询
            </button>
            <button class="tab-btn" data-module="external">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                外部信息获取
            </button>
        </div>

        <!-- 主体：左右分栏 -->
        <div class="main">
            <!-- 左侧参数区 -->
            <div class="param-panel" id="paramPanel">
                <!-- 年报数据 -->
                <div class="form-panel active" id="form-annual">
                    <form id="annualForm" class="module-form">
                        <div class="form-actions">
                            <button type="submit" class="btn-primary" id="annualSubmitBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                开始获取
                            </button>
                            <button type="button" class="btn-secondary" id="annualResetBtn">清空</button>
                        </div>
                        <div class="form-group">
                            <label class="mini-label">年度范围</label>
                            <div class="year-range-compact">
                                <div class="custom-select-wrap">
                                    <select id="startYear" required><option value="">--</option></select>
                                </div>
                                <span class="dash">&mdash;</span>
                                <div class="custom-select-wrap">
                                    <select id="endYear" required><option value="">--</option></select>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="mini-label">企业名单</label>
                            <textarea id="textInput" rows="8" placeholder="企业名称或股票代码，逗号或换行分隔">平安银行股份有限公司
招商银行股份有限公司
国银金融租赁股份有限公司
招商证券股份有限公司
国信证券股份有限公司
长城证券股份有限公司
第一创业证券股份有限公司
中信证券股份有限公司
中国平安保险（集团）股份有限公司
阳光保险集团股份有限公司</textarea>
                        </div>
                        <div class="form-group">
                            <label class="mini-label">或上传文件</label>
                            <div class="upload-area" id="uploadArea">
                                <input type="file" id="fileInput" accept=".txt,.csv">
                                <div class="upload-content">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    <span>拖拽 .txt / .csv 文件</span>
                                </div>
                                <div class="file-info" id="fileInfo" style="display:none;">
                                    <span class="file-name" id="fileName"></span>
                                    <button type="button" class="file-remove" id="fileRemove">&times;</button>
                                </div>
                            </div>
                        </div>
                        <div class="toggle-row">
                            <label class="toggle-inline-vertical">
                                <span class="toggle-switch"><input type="checkbox" id="industryAvgToggle"><span class="toggle-slider"></span></span>
                                <span class="toggle-label-text">同行业均值</span>
                            </label>
                            <label class="toggle-inline-vertical">
                                <span class="toggle-switch"><input type="checkbox" id="mergeReportsToggle"><span class="toggle-slider"></span></span>
                                <span class="toggle-label-text">按报表合并</span>
                            </label>
                        </div>
                    </form>
                </div>

                <!-- 机构名录 -->
                <div class="form-panel" id="form-institutions">
                    <form id="institutionsForm" class="module-form">
                        <div class="form-actions">
                            <button type="submit" class="btn-primary" id="institutionsSubmitBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                开始获取
                            </button>
                        </div>
                        <div class="toggle-row">
                            <label class="toggle-inline-vertical">
                                <span class="toggle-switch"><input type="checkbox" id="bank_insurance" checked><span class="toggle-slider"></span></span>
                                <span class="toggle-label-text">银行保险法人名单</span>
                            </label>
                            <label class="toggle-inline-vertical">
                                <span class="toggle-switch"><input type="checkbox" id="securities_fund" checked><span class="toggle-slider"></span></span>
                                <span class="toggle-label-text">证券基金期货名录</span>
                            </label>
                            <label class="toggle-inline-vertical">
                                <span class="toggle-switch"><input type="checkbox" id="amac" checked><span class="toggle-slider"></span></span>
                                <span class="toggle-label-text">公募基金管理人名录</span>
                            </label>
                        </div>
                    </form>
                </div>

                <!-- 深交所概况 -->
                <div class="form-panel" id="form-szse">
                    <form id="szseForm" class="module-form">
                        <div class="form-actions">
                            <button type="submit" class="btn-primary" id="szseSubmitBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                开始获取
                            </button>
                        </div>
                        <div class="form-group">
                            <label class="mini-label">年度选择</label>
                            <div class="custom-select-wrap" style="width:140px;">
                                <select id="szseYear"><option value="">--</option></select>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- 分红查询 -->
                <div class="form-panel" id="form-dividend">
                    <form id="dividendForm" class="module-form">
                        <div class="form-actions">
                            <button type="submit" class="btn-primary" id="dividendSubmitBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                开始获取
                            </button>
                        </div>
                        <div class="form-group">
                            <label class="mini-label">年度范围</label>
                            <div class="year-range-compact">
                                <div class="custom-select-wrap">
                                    <select id="dividendStartYear" required><option value="">--</option></select>
                                </div>
                                <span class="dash">&mdash;</span>
                                <div class="custom-select-wrap">
                                    <select id="dividendEndYear" required><option value="">--</option></select>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="mini-label">企业名单</label>
                            <textarea id="dividendTextInput" rows="3" placeholder="企业名称或股票代码，逗号或换行分隔">平安银行股份有限公司
招商银行股份有限公司
国银金融租赁股份有限公司
招商证券股份有限公司
国信证券股份有限公司
长城证券股份有限公司
第一创业证券股份有限公司
中信证券股份有限公司
中国平安保险（集团）股份有限公司
阳光保险集团股份有限公司</textarea>
                        </div>
                        <div class="form-group">
                            <label class="mini-label">或上传文件</label>
                            <div class="upload-area" id="dividendUploadArea">
                                <input type="file" id="dividendFileInput" accept=".txt,.csv">
                                <div class="upload-content">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    <span>拖拽 .txt / .csv 文件</span>
                                </div>
                                <div class="file-info" id="dividendFileInfo" style="display:none;">
                                    <span class="file-name" id="dividendFileName"></span>
                                    <button type="button" class="file-remove" id="dividendFileRemove">&times;</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- 外部信息 -->
                <div class="form-panel" id="form-external">
                    <form id="externalForm" class="module-form">
                        <div class="form-actions">
                            <button type="submit" class="btn-primary" id="externalSubmitBtn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                开始获取
                            </button>
                        </div>
                        <div class="toggle-row">
                            <label class="toggle-inline-vertical">
                                <span class="toggle-switch"><input type="checkbox" id="extPenalty" checked><span class="toggle-slider"></span></span>
                                <span class="toggle-label-text">处罚信息</span>
                            </label>
                            <label class="toggle-inline-vertical">
                                <span class="toggle-switch"><input type="checkbox" id="extStats"><span class="toggle-slider"></span></span>
                                <span class="toggle-label-text">统计信息</span>
                            </label>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 右侧结果共享区 -->
            <div class="results-panel" id="resultsPanel">
                <div class="results-placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
                        <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/>
                    </svg>
                    <p>选择上方功能开始使用</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
